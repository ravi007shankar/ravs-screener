<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merk-I | GEX Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e17; --bg-secondary: #0f172a; --bg-tertiary: #1e293b;
  --border: #1e293b; --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #64748b;
  --accent-gold: #fbbf24; --accent-green: #22c55e; --accent-red: #ef4444;
  --accent-purple: #a855f7; --accent-blue: #38bdf8; --accent-orange: #f97316;
  --font-main: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-main); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

/* NAVBAR */
.navbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 28px; border-bottom: 1px solid var(--border);
  background: rgba(10,14,23,0.98); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent-gold), #f59e0b);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: var(--bg-primary); font-size: 18px;
}
.brand-text h1 {
  font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
  background: linear-gradient(90deg, var(--accent-gold), #f59e0b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-text p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.nav-right { display: flex; align-items: center; gap: 12px; }
.status-pill {
  display: flex; align-items: center; gap: 6px; background: var(--bg-secondary);
  border: 1px solid var(--border); padding: 6px 14px; border-radius: 8px;
  font-size: 12px; color: var(--text-secondary);
}
.status-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s infinite; }
.status-dot.error { background: var(--accent-red); animation: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* MAIN */
.main-container { max-width: 1440px; margin: 0 auto; padding: 24px 28px; }
.section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
.section-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.section-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.ticker-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.ticker-btn {
  padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 700;
  border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-secondary);
  cursor: pointer; transition: all 0.15s; font-family: var(--font-main);
}
.ticker-btn:hover { border-color: var(--accent-gold); color: var(--text-primary); }
.ticker-btn.active { background: var(--accent-gold); color: var(--bg-primary); border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(251,191,36,0.15); }
.ticker-input-wrap { display: flex; gap: 6px; align-items: center; margin-left: 8px; }
.ticker-input {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; color: var(--text-primary); font-size: 13px; font-family: var(--font-main);
  width: 120px; text-transform: uppercase;
}
.ticker-input:focus { outline: none; border-color: var(--accent-gold); }
.btn-go {
  background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.btn-go:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
.btn-refresh {
  background: transparent; color: var(--text-muted); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  margin-left: auto;
}
.btn-refresh:hover { color: var(--accent-gold); border-color: var(--accent-gold); }

.card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.card-title { font-size: 12px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }

/* SPOT BAR */
.spot-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,41,59,0.6));
  border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 24px; margin-bottom: 16px; flex-wrap: wrap; gap: 16px;
}
.spot-main h2 { font-size: 36px; font-weight: 800; letter-spacing: -1.5px; }
.spot-change { font-size: 14px; font-weight: 600; margin-left: 8px; }
.spot-change.up { color: var(--accent-green); }
.spot-change.down { color: var(--accent-red); }
.spot-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.spot-metrics { display: flex; gap: 28px; flex-wrap: wrap; }
.spot-metric { text-align: right; }
.spot-metric-value { font-size: 20px; font-weight: 700; }
.spot-metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

/* ===== STRUCTURE MAP ===== */
.structure-map {
  background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(10,14,23,0.95));
  border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; margin-bottom: 16px;
}
.structure-map-title {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.8px; font-weight: 700; margin-bottom: 16px;
}
.structure-lane {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px; position: relative;
}
.structure-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  width: 100px; text-align: right; color: var(--text-muted);
}
.structure-bar {
  height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; font-family: var(--font-mono);
  min-width: 70px; padding: 0 10px;
}
.structure-bar.positive { background: linear-gradient(90deg, #14532d, #166534); color: #86efac; border: 1px solid rgba(34,197,94,0.3); }
.structure-bar.negative { background: linear-gradient(90deg, #581c87, #7c3aed); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.3); }
.structure-bar.spot { background: linear-gradient(90deg, rgba(56,189,248,0.2), rgba(56,189,248,0.1)); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
.structure-bar.gold { background: linear-gradient(90deg, rgba(251,191,36,0.2), rgba(251,191,36,0.1)); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
.structure-arrow { font-size: 14px; }
.structure-arrow.up { color: var(--accent-green); }
.structure-arrow.down { color: var(--accent-purple); }
.structure-desc { font-size: 10px; color: var(--text-muted); margin-left: 6px; }

/* HEATMAP */
.heatmap-container { overflow-x: auto; max-height: 68vh; overflow-y: auto; border-radius: 8px; }
.heatmap-grid { display: grid; grid-template-columns: 140px repeat(5, 1fr); gap: 3px; font-size: 11px; min-width: 600px; padding: 4px; }
.heatmap-header { color: var(--text-muted); font-weight: 700; padding: 12px 6px; text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; background: var(--bg-secondary); z-index: 5; border-bottom: 1px solid var(--border); }
.heatmap-strike { 
  color: var(--text-muted); padding: 10px 8px; text-align: right; font-weight: 600; 
  font-family: var(--font-mono); font-size: 11px; display: flex; align-items: center; 
  justify-content: flex-end; gap: 6px; border-radius: 4px; flex-wrap: wrap;
}
.heatmap-strike.spot { 
  color: var(--accent-gold); font-weight: 800; 
  background: linear-gradient(90deg, rgba(56,189,248,0.08), transparent);
  border-left: 3px solid var(--accent-blue);
}
.heatmap-strike .spot-arrow { color: var(--accent-blue); font-size: 10px; }
.heatmap-strike .king-icon { color: var(--accent-gold); font-size: 11px; }

/* Annotation badges on strike rows */
.annotation-badge {
  font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: 0.3px; line-height: 1;
}
.annotation-king { background: rgba(251,191,36,0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
.annotation-spot { background: rgba(56,189,248,0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
.annotation-ceiling { background: rgba(34,197,94,0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
.annotation-floor { background: rgba(34,197,94,0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
.annotation-vacuum { background: rgba(168,85,247,0.2); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
.annotation-band { background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid rgba(34,197,94,0.4); }

.heatmap-cell {
  padding: 10px 4px; text-align: center; border-radius: 5px; font-weight: 700;
  font-family: var(--font-mono); font-size: 10px; position: relative; transition: all 0.15s;
  min-height: 38px; display: flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
}
.heatmap-cell:hover { 
  transform: scale(1.1); z-index: 20; 
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  border-color: rgba(255,255,255,0.2);
}
.cell-empty { background: rgba(30,41,59,0.3); color: #475569; }
.cell-spot { 
  box-shadow: inset 0 0 0 2px var(--accent-blue), 0 0 15px rgba(56,189,248,0.15);
}
.cell-king { 
  box-shadow: inset 0 0 0 1px var(--accent-gold), 0 0 10px rgba(251,191,36,0.2);
}

/* Cell annotation effects */
.cell-annotation-king { box-shadow: inset 0 0 0 2px var(--accent-gold), 0 0 20px rgba(251,191,36,0.3) !important; }
.cell-annotation-ceiling { border-top: 3px solid var(--accent-green) !important; }
.cell-annotation-floor { border-bottom: 3px solid var(--accent-green) !important; }
.cell-annotation-vacuum { box-shadow: inset 0 0 0 2px var(--accent-purple), 0 0 15px rgba(168,85,247,0.3) !important; }
.cell-annotation-band { border-left: 3px solid var(--accent-green); border-right: 3px solid var(--accent-green); }

/* TOOLTIP */
.heatmap-cell .tooltip {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: var(--bg-primary); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 6px; font-size: 10px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 30;
  color: var(--text-primary); font-weight: 600;
}
.heatmap-cell:hover .tooltip { opacity: 1; }

.xp-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.xp-item { border-radius: 6px; padding: 10px; text-align: center; font-weight: 700; }
.xp-item.positive { background: linear-gradient(135deg, #14532d, #166534); color: #86efac; }
.xp-item.negative { background: linear-gradient(135deg, #581c87, #7c3aed); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.3); }
.xp-label { font-size: 9px; text-transform: uppercase; font-weight: 700; opacity: 0.8; }
.xp-value { font-size: 13px; font-weight: 800; }

/* LEVELS */
.levels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.level-card { 
  background: linear-gradient(135deg, rgba(15,23,42,0.8), rgba(30,41,59,0.4));
  border: 1px solid var(--border); border-radius: 10px; padding: 14px; 
  text-align: center; transition: all 0.2s;
}
.level-card:hover { border-color: var(--accent-gold); transform: translateY(-2px); }
.level-card.highlight { 
  border-color: var(--accent-gold); 
  background: linear-gradient(135deg, rgba(251,191,36,0.08), rgba(251,191,36,0.02));
}
.level-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.level-value { font-size: 20px; font-weight: 800; margin-top: 6px; }
.level-desc { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

/* PATTERNS */
.pattern-list { display: flex; flex-direction: column; gap: 8px; }
.pattern-tag { 
  background: linear-gradient(90deg, rgba(30,41,59,0.8), rgba(15,23,42,0.6));
  border-left: 3px solid var(--accent-gold); padding: 12px 14px; 
  border-radius: 0 8px 8px 0; cursor: pointer; transition: all 0.2s;
}
.pattern-tag:hover { background: linear-gradient(90deg, #283548, #1e293b); transform: translateX(4px); }
.pattern-tag.bearish { border-left-color: var(--accent-red); }
.pattern-tag.bullish { border-left-color: var(--accent-green); }
.pattern-tag.neutral { border-left-color: var(--accent-blue); }
.pattern-tag.warning { border-left-color: var(--accent-orange); }
.pattern-tag-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pattern-tag-name { font-weight: 700; font-size: 12px; }
.pattern-tag-meta { font-size: 10px; color: var(--text-muted); font-weight: 600; }
.pattern-tag-desc { font-size: 11px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }

/* Direction badge on patterns */
.pattern-direction {
  font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: 0.3px; margin-left: auto; flex-shrink: 0;
}
.pattern-tag.bullish .pattern-direction { background: rgba(34,197,94,0.2); color: var(--accent-green); }
.pattern-tag.bearish .pattern-direction { background: rgba(239,68,68,0.2); color: var(--accent-red); }
.pattern-tag.neutral .pattern-direction { background: rgba(56,189,248,0.2); color: var(--accent-blue); }
.pattern-tag.warning .pattern-direction { background: rgba(249,115,22,0.2); color: var(--accent-orange); }

/* TRADE PLAN */
.trade-plan { 
  background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,41,59,0.5));
  border: 1px solid var(--border); border-radius: 12px; padding: 20px; 
}
.trade-plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.trade-bias { padding: 5px 16px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.trade-bias.bullish { background: rgba(34,197,94,0.15); color: var(--accent-green); border: 1px solid rgba(34,197,94,0.3); }
.trade-bias.bearish { background: rgba(239,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(239,68,68,0.3); }
.trade-bias.neutral { background: rgba(56,189,248,0.15); color: var(--accent-blue); border: 1px solid rgba(56,189,248,0.3); }
.trade-bias.notrade { background: rgba(148,163,184,0.15); color: var(--text-secondary); border: 1px solid rgba(148,163,184,0.3); }
.trade-confidence { font-size: 13px; font-weight: 700; color: var(--accent-gold); }
.trade-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(51,65,85,0.4); font-size: 12px; }
.trade-row:last-child { border-bottom: none; }
.trade-label { color: var(--text-muted); font-weight: 600; }
.trade-value { color: var(--text-primary); font-weight: 700; text-align: right; }
.trade-note { 
  margin-top: 14px; padding: 14px; background: rgba(10,14,23,0.6); 
  border-radius: 8px; border: 1px solid var(--border); 
  font-size: 11px; color: var(--text-secondary); line-height: 1.6; font-style: italic;
}

.two-col { display: grid; grid-template-columns: 1fr 380px; gap: 20px; }

/* LOADING */
.loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
.loading::after { content: ""; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; margin-left: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

.error { padding: 20px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; color: var(--accent-red); font-size: 13px; }

.last-update { font-size: 11px; color: var(--text-muted); margin-left: 12px; }

@media (max-width: 1100px) {
  .two-col { grid-template-columns: 1fr; }
  .levels-grid { grid-template-columns: repeat(3, 1fr); }
  .heatmap-grid { grid-template-columns: 120px repeat(5, 1fr); }
}
@media (max-width: 768px) {
  .navbar { flex-direction: column; gap: 12px; padding: 12px 16px; }
  .main-container { padding: 16px; }
  .spot-bar { flex-direction: column; gap: 12px; align-items: flex-start; }
  .spot-metrics { width: 100%; justify-content: space-between; }
  .levels-grid { grid-template-columns: repeat(2, 1fr); }
  .ticker-bar { gap: 6px; }
  .ticker-input { width: 100px; }
  .structure-label { width: 70px; }
}

/* PRIMARY PATTERN */
.primary-pattern-card {
  background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.6));
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 8px;
}
.primary-pattern-card.bullish { border-color: rgba(34,197,94,0.4); background: linear-gradient(135deg, rgba(34,197,94,0.08), rgba(15,23,42,0.95)); }
.primary-pattern-card.bearish { border-color: rgba(239,68,68,0.4); background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(15,23,42,0.95)); }
.primary-pattern-card.neutral { border-color: rgba(56,189,248,0.4); background: linear-gradient(135deg, rgba(56,189,248,0.08), rgba(15,23,42,0.95)); }

.primary-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
}
.primary-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900;
}
.primary-icon.bullish { background: rgba(34,197,94,0.2); color: var(--accent-green); }
.primary-icon.bearish { background: rgba(239,68,68,0.2); color: var(--accent-red); }
.primary-icon.neutral { background: rgba(56,189,248,0.2); color: var(--accent-blue); }

.primary-name {
  font-size: 16px; font-weight: 800; letter-spacing: -0.3px;
}
.primary-name.bullish { color: var(--accent-green); }
.primary-name.bearish { color: var(--accent-red); }
.primary-name.neutral { color: var(--accent-blue); }

.primary-meta {
  font-size: 11px; color: var(--text-muted); font-weight: 600;
}

.primary-explanation {
  font-size: 12px; color: var(--text-secondary); line-height: 1.6;
  padding: 10px; background: rgba(10,14,23,0.5); border-radius: 6px;
  border-left: 3px solid var(--border);
}
.primary-explanation.bullish { border-left-color: var(--accent-green); }
.primary-explanation.bearish { border-left-color: var(--accent-red); }
.primary-explanation.neutral { border-left-color: var(--accent-blue); }

/* Supporting patterns collapsed */
.pattern-list.collapsed { display: none; }
.pattern-list.expanded { display: flex; }

/* Small pattern for supporting signals */
.pattern-tag-small {
  background: linear-gradient(90deg, rgba(30,41,59,0.6), rgba(15,23,42,0.4));
  border-left: 2px solid var(--border); padding: 8px 10px;
  border-radius: 0 6px 6px 0; font-size: 11px;
}
.pattern-tag-small.bullish { border-left-color: var(--accent-green); }
.pattern-tag-small.bearish { border-left-color: var(--accent-red); }
.pattern-tag-small.neutral { border-left-color: var(--accent-blue); }
.pattern-tag-small.warning { border-left-color: var(--accent-orange); }

/* ===== BATTLEFIELD MAP ===== */
.battlefield-card {
  background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(10,14,23,0.98));
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.battlefield-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
  opacity: 0.3;
}

.battlefield-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.battlefield-title {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.battlefield-title::before {
  content: "⚔";
  font-size: 14px;
}

.battlefield-bias {
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.battlefield-bias.bullish { background: rgba(34,197,94,0.15); color: var(--accent-green); border: 1px solid rgba(34,197,94,0.3); }

<script>
let currentData = null;
let currentTicker = 'SPX';
let refreshInterval = null;

async function loadTicker(ticker) {
  currentTicker = ticker;
  document.querySelectorAll('.ticker-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.ticker-btn[data-ticker="${ticker}"]`);
  if (btn) btn.classList.add('active');

  document.getElementById('gexLoading').style.display = 'flex';
  document.getElementById('gexContent').style.display = 'none';
  document.getElementById('gexError').style.display = 'none';

  try {
    const response = await fetch(`/api/gex/${ticker}`);
    if (!response.ok) throw new Error('API error: ' + response.status);
    const data = await response.json();
    currentData = data;
    renderGEX(data);
    setStatus(true, 'Live API Connected');
    document.getElementById('gexLoading').style.display = 'none';
    document.getElementById('gexContent').style.display = 'block';
  } catch (err) {
    console.log('Live API failed:', err);
    document.getElementById('gexError').textContent = 'Live API unavailable. Showing fallback data. Error: ' + err.message;
    document.getElementById('gexError').style.display = 'block';
    const fallback = getFallbackData(ticker);
    currentData = fallback;
    renderGEX(fallback);
    setStatus(false, 'API Error — Fallback Data');
    document.getElementById('gexLoading').style.display = 'none';
    document.getElementById('gexContent').style.display = 'block';
  }
  updateTimestamp();
}

function loadCustomTicker() {
  const input = document.getElementById('customTicker');
  const ticker = input.value.trim().toUpperCase();
  if (!ticker) return;
  const bar = document.getElementById('gexTickerBar');
  const existing = bar.querySelector(`[data-ticker="${ticker}"]`);
  if (!existing) {
    const btn = document.createElement('button');
    btn.className = 'ticker-btn';
    btn.setAttribute('data-ticker', ticker);
    btn.textContent = ticker;
    btn.onclick = () => loadTicker(ticker);
    const wrap = bar.querySelector('.ticker-input-wrap');
    bar.insertBefore(btn, wrap);
  }
  loadTicker(ticker);
  input.value = '';
}

function manualRefresh() {
  if (currentTicker) loadTicker(currentTicker);
}

function setStatus(online, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (online) {
    dot.className = 'status-dot';
    txt.textContent = text;
  } else {
    dot.className = 'status-dot error';
    txt.textContent = text;
  }
}

function updateTimestamp() {
  const now = new Date();
  document.getElementById('lastUpdate').textContent = 'Updated: ' + now.toLocaleTimeString();
}

// ===== STRUCTURE MAP =====
function renderStructureMap(data) {
  const container = document.getElementById('structureMap');
  if (!container) return;

  const spot = data.spot || 0;
  const p = data.patterns || {};
  const tp = data.trade_plan || {};

  let html = '<div class="structure-map-title">Gamma Architecture</div>';

  // Ceiling
  const ceiling = p.CEILING?.strike || (p.THE_RUG?.ceiling);
  if (ceiling) {
    html += `<div class="structure-lane"><span class="structure-label">Ceiling</span><span class="structure-arrow">↓</span><div class="structure-bar positive">${ceiling}</div><span class="structure-desc">+GEX rejects price</span></div>`;
  }

  // Vacuum Above
  const vacAbove = p.VACUUM_ABOVE?.strike || (tp.vacuum_above);
  if (vacAbove) {
    html += `<div class="structure-lane"><span class="structure-label">Vacuum ↑</span><span class="structure-arrow up">↑</span><div class="structure-bar negative">${vacAbove}</div><span class="structure-desc" style="color:var(--accent-purple)">Pulls price UP</span></div>`;
  }

  // Spot
  html += `<div class="structure-lane"><span class="structure-label">Spot</span><span class="structure-arrow" style="color:var(--accent-blue)">▶</span><div class="structure-bar spot">${spot.toFixed(2)}</div><span class="structure-desc">${p.SPOT?.regime || 'NEUTRAL'}</span></div>`;

  // Vacuum Below
  const vacBelow = p.VACUUM_BELOW?.strike || (tp.vacuum_below);
  if (vacBelow) {
    html += `<div class="structure-lane"><span class="structure-label">Vacuum ↓</span><span class="structure-arrow down">↓</span><div class="structure-bar negative">${vacBelow}</div><span class="structure-desc" style="color:var(--accent-purple)">Pulls price DOWN</span></div>`;
  }

  // Floor
  const floor = p.FLOOR?.strike || (p.REVERSE_RUG?.floor) || (tp.floor);
  if (floor) {
    html += `<div class="structure-lane"><span class="structure-label">Floor</span><span class="structure-arrow">↑</span><div class="structure-bar positive">${floor}</div><span class="structure-desc">+GEX supports price</span></div>`;
  }

  // Pin Band
  if (tp.band_low && tp.band_high) {
    html += `<div class="structure-lane"><span class="structure-label">Pin Band</span><span class="structure-arrow" style="color:var(--accent-green)">⟷</span><div class="structure-bar positive" style="min-width:100px;">${tp.band_low}–${tp.band_high}</div><span class="structure-desc" style="color:var(--accent-green)">Spot inside band</span></div>`;
  }

  // King
  if (p.KING?.strike) {
    const king = p.KING;
    const kingColor = king.is_negative ? 'var(--accent-purple)' : 'var(--accent-green)';
    const kingText = king.is_negative ? 'VACUUM' : 'MAGNET';
    html += `<div class="structure-lane"><span class="structure-label">King</span><span style="color:${kingColor};font-size:14px;">👑</span><div class="structure-bar ${king.is_negative ? 'negative' : 'positive'}">${king.strike}</div><span class="structure-desc" style="color:${kingColor}">${kingText} | ${formatGex(king.gex)}</span></div>`;
  }

  container.innerHTML = html;
}

// ===== BATTLEFIELD MAP =====
function renderBattlefield(data) {
  const container = document.getElementById('battlefieldSvgContainer');
  const footer = document.getElementById('battlefieldFooter');
  const biasEl = document.getElementById('bfBias');
  const briefEl = document.getElementById('bfBrief');
  const confEl = document.getElementById('bfConfidence');
  if (!container) return;

  const spot = data.spot || 0;
  const p = data.patterns || {};
  const tp = data.trade_plan || {};
  const expiries = data.expiries || [];
  const bias = tp.bias || 'NEUTRAL';
  const confidence = ((tp.confidence || 0) * 100).toFixed(0);

  const biasClass = bias === 'BULLISH' ? 'bullish' : bias === 'BEARISH' ? 'bearish' : 'neutral';
  biasEl.className = 'battlefield-bias ' + biasClass;
  biasEl.textContent = bias;

  const isIndex = ['SPX', 'SPY', 'QQQ', 'IWM', 'DIA'].includes(data.ticker);
  const strikeRange = isIndex ? 0.04 : 0.20;
  const kingStrike = p.KING?.strike;

  const strikes = (data.heatmap || []).filter(row => {
    if (!row.strike) return false;
    const inRange = Math.abs(row.strike - spot) / spot <= strikeRange;
    const isKing = kingStrike && Math.abs(row.strike - kingStrike) < 0.01;
    return inRange || isKing;
  }).sort((a, b) => b.strike - a.strike).map(row => {
    let netGex = 0;
    expiries.forEach(exp => {
      const val = row[exp] || 0;
      const sign = row[exp + '_sign'];
      const unit = row[exp + '_unit'] || '';
      let raw = Math.abs(val);
      if (unit === 'M') raw = val * 1000000;
      else if (unit === 'K') raw = val * 1000;
      else if (unit === 'B') raw = val * 1000000000;
      else raw = val;
      if (sign === 'negative') raw = -raw;
      netGex += raw;
    });
    return {
      strike: row.strike,
      netGex: netGex,
      isSpot: row.is_spot,
      isKing: kingStrike && Math.abs(row.strike - kingStrike) < 0.01
    };
  });

  const king = p.KING || {};
  const ceiling = tp.ceiling || p.THE_RUG?.ceiling || p.CEILING?.strike;
  const floor = tp.floor || p.REVERSE_RUG?.floor || p.FLOOR?.strike;
  const vacAbove = tp.vacuum_above || p.VACUUM_ABOVE?.strike;
  const vacBelow = tp.vacuum_below || p.VACUUM_BELOW?.strike;
  const bandLow = tp.band_low;
  const bandHigh = tp.band_high;

  const W = 340;
  const CX = 170;
  const ROW_H = 26;
  const PAD_TOP = 10;
  const PAD_BOT = 90;
  const H = strikes.length * ROW_H + PAD_TOP + PAD_BOT;
  const MAX_BAR = 110;

  const maxAbs = Math.max(...strikes.map(s => Math.abs(s.netGex)), 1);

  let svg = `<svg class="battlefield-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="posTerrain" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#14532d"/>
        <stop offset="100%" stop-color="#22c55e"/>
      </linearGradient>
      <linearGradient id="negTerrain" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#581c87"/>
        <stop offset="100%" stop-color="#a855f7"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>`;

  strikes.forEach((s, i) => {
    const y = PAD_TOP + i * ROW_H;
    const cy = y + ROW_H / 2;
    const isKingRow = s.isKing;
    const isSpotRow = s.isSpot;
    const isCeil = ceiling && Math.abs(s.strike - ceiling) < 0.01;
    const isFloor = floor && Math.abs(s.strike - floor) < 0.01;
    const isVacAbove = vacAbove && Math.abs(s.strike - vacAbove) < 0.01;
    const isVacBelow = vacBelow && Math.abs(s.strike - vacBelow) < 0.01;
    const inBand = bandLow && bandHigh && s.strike >= bandLow && s.strike <= bandHigh;

    if (isSpotRow) {
      svg += `<rect x="0" y="${y}" width="${W}" height="${ROW_H}" fill="rgba(56,189,248,0.06)" rx="4"/>`;
    } else if (isKingRow) {
      svg += `<rect x="0" y="${y}" width="${W}" height="${ROW_H}" fill="rgba(251,191,36,0.06)" rx="4"/>`;
    } else if (inBand) {
      svg += `<rect x="0" y="${y}" width="${W}" height="${ROW_H}" fill="rgba(34,197,94,0.04)" rx="4"/>`;
    }

    const labelColor = isSpotRow ? 'var(--accent-blue)' : isKingRow ? 'var(--accent-gold)' : 'var(--text-muted)';
    const labelWeight = isSpotRow || isKingRow ? '800' : '600';
    svg += `<text x="50" y="${cy + 4}" text-anchor="end" fill="${labelColor}" font-size="11" font-weight="${labelWeight}" font-family="var(--font-mono)">${s.strike.toLocaleString()}</text>`;

    svg += `<line x1="${CX}" y1="${y + 2}" x2="${CX}" y2="${y + ROW_H - 2}" stroke="#1e293b" stroke-width="1"/>`;

    const ratio = Math.sqrt(Math.abs(s.netGex) / maxAbs);
    const barW = Math.max(ratio * MAX_BAR, 0);
    const absGex = Math.abs(s.netGex);

    if (s.netGex > 0 && barW > 2) {
      svg += `<rect class="battlefield-terrain-pos" x="${CX}" y="${y + 6}" width="${barW}" height="14" />`;
      const labelX = barW > 40 ? CX + barW - 4 : CX + barW + 4;
      const anchor = barW > 40 ? 'end' : 'start';
      svg += `<text x="${labelX}" y="${cy + 4}" text-anchor="${anchor}" fill="#86efac" class="bf-value pos">${formatGexMini(absGex)}</text>`;
    } else if (s.netGex < 0 && barW > 2) {
      svg += `<rect class="battlefield-terrain-neg" x="${CX - barW}" y="${y + 6}" width="${barW}" height="14" />`;
      const labelX = barW > 40 ? CX - barW + 4 : CX - barW - 4;
      const anchor = barW > 40 ? 'start' : 'end';
      svg += `<text x="${labelX}" y="${cy + 4}" text-anchor="${anchor}" fill="#d8b4fe" class="bf-value neg">${formatGexMini(absGex)}</text>`;
    }

    if (isSpotRow) {
      svg += `<circle cx="${CX}" cy="${cy}" r="12" fill="rgba(56,189,248,0.15)" class="bf-spot-pulse"/>`;
      svg += `<polygon points="${CX-5},${cy-4} ${CX+5},${cy-4} ${CX},${cy+5}" fill="var(--accent-blue)" stroke="#0a0e17" stroke-width="1"/>`;
      svg += `<text x="${CX + 18}" y="${cy + 4}" fill="var(--accent-blue)" font-size="10" font-weight="700">SPOT</text>`;
    }

    if (isKingRow) {
      const kingX = CX + (s.netGex > 0 ? barW + 16 : -16);
      const anchor = s.netGex > 0 ? 'start' : 'end';
      const kColor = king.is_negative ? '#a855f7' : '#22c55e';
      svg += `<text x="${kingX}" y="${cy + 4}" text-anchor="${anchor}" fill="${kColor}" font-size="12" class="bf-king-glow">👑</text>`;
      svg += `<text x="${kingX + (s.netGex > 0 ? 16 : -16)}" y="${cy + 4}" text-anchor="${anchor}" fill="${kColor}" font-size="9" font-weight="700">${king.is_negative ? 'VACUUM' : 'MAGNET'}</text>`;
    }

    if (isCeil || isFloor) {
      svg += `<rect x="${CX + MAX_BAR + 8}" y="${y + 4}" width="3" height="18" fill="var(--accent-green)" rx="1"/>`;
      svg += `<text x="${CX + MAX_BAR + 18}" y="${cy + 4}" fill="var(--accent-green)" font-size="9" font-weight="700">${isCeil ? 'WALL' : 'FLOOR'}</text>`;
    }

    if (isVacAbove || isVacBelow) {
      const vx = CX - barW - 12;
      svg += `<text x="${vx}" y="${cy + 4}" text-anchor="end" fill="var(--accent-purple)" font-size="11" class="bf-vacuum-glow">🌀</text>`;
    }
  });

  const spotIndex = strikes.findIndex(s => s.isSpot);
  const spotY = spotIndex >= 0 ? PAD_TOP + spotIndex * ROW_H + ROW_H/2 : PAD_TOP + (strikes.length * ROW_H / 2);
  const kingIndex = strikes.findIndex(s => s.isKing);
  const kingY = kingIndex >= 0 ? PAD_TOP + kingIndex * ROW_H + ROW_H/2 : null;
  const ceilIndex = ceiling ? strikes.findIndex(s => Math.abs(s.strike - ceiling) < 0.01) : -1;
  const ceilY = ceilIndex >= 0 ? PAD_TOP + ceilIndex * ROW_H + ROW_H/2 : null;
  const floorIndex = floor ? strikes.findIndex(s => Math.abs(s.strike - floor) < 0.01) : -1;
  const floorY = floorIndex >= 0 ? PAD_TOP + floorIndex * ROW_H + ROW_H/2 : null;

  function drawArrow(fromY, toY, xOffset, color, label) {
    if (fromY === null || toY === null) return;
    const dist = Math.abs(toY - fromY);
    if (dist <= 30) return;
    const dir = toY < fromY ? -1 : 1;
    const startY = fromY + (dir * 15);
    const endY = toY + (dir * -15);
    const ax = CX + xOffset;
    svg += `<line class="bf-force-arrow" x1="${ax}" y1="${startY}" x2="${ax}" y2="${endY}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`;
    const ahSize = 4;
    const tipY = endY;
    const baseY = endY + (dir * -8);
    svg += `<polygon points="${ax},${tipY} ${ax-ahSize},${baseY} ${ax+ahSize},${baseY}" fill="${color}"/>`;
    const midY = (startY + endY) / 2;
    svg += `<text x="${ax + (xOffset < 0 ? -10 : 10)}" y="${midY + 3}" text-anchor="${xOffset < 0 ? 'end' : 'start'}" fill="${color}" font-size="9" font-weight="700">${label}</text>`;
  }

  if (kingY) {
    const kColor = king.is_negative ? '#a855f7' : '#22c55e';
    const dist = Math.abs(kingStrike - spot).toFixed(2);
    const arrowDir = kingStrike > spot ? '↑' : '↓';
    drawArrow(spotY, kingY, -40, kColor, `${dist} ${arrowDir}`);
  }
  if (ceilY) {
    const dist = Math.abs(ceiling - spot).toFixed(2);
    drawArrow(spotY, ceilY, 40, '#22c55e', `${dist} ↑`);
  }
  if (floorY) {
    const dist = Math.abs(floor - spot).toFixed(2);
    drawArrow(spotY, floorY, 40, '#22c55e', `${dist} ↓`);
  }

  const gaugeY = H - 70;
  svg += `<rect class="bf-gauge-bg" x="20" y="${gaugeY}" width="300" height="20"/>`;
  const gaugeW = (confidence / 100) * 300;
  svg += `<rect class="bf-gauge-fill ${biasClass}" x="20" y="${gaugeY}" width="${gaugeW}" height="20"/>`;
  svg += `<text x="170" y="${gaugeY + 14}" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">${bias} PRESSURE: ${confidence}%</text>`;
  svg += `<text x="20" y="${gaugeY + 40}" fill="var(--text-muted)" font-size="9">🟢 = +GEX wall  |  💜 = −GEX void  |  👑 = King  |  ▶ = Spot</text>`;

  if (kingStrike) {
    const dist = Math.abs(kingStrike - spot).toFixed(2);

  }
  if (floor) {

    footerHtml += `<div class="bf-stat"><div class="bf-stat-label">To Floor</div><div class="bf-stat-value" style="color:var(--accent-green)">${dist} ↓</div></div>`;

  footer.innerHTML = footerHtml || '<div class="bf-stat" style="grid-column:1/-1;"><div class="bf-stat-label">No key levels detected</div></div>';

  confEl.textContent = confidence + '% confidence';
  const briefs = {
    'THE_RUG': `Spot (${spot}) sits under a wall at ${ceiling || '—'}. The king at ${kingStrike || '—'} is a ${king.is_negative ? 'vacuum' : 'magnet'}. Rallies hit the wall, drops accelerate through voids. Short bias.`,

    'NEUTRAL': `No dominant gamma structure. Mixed forces. Wait for a clearer setup or reduce size.`
  };

}

function formatGexMini(val) {
  const abs = Math.abs(val);
  if (abs >= 1e9) return (abs/1e9).toFixed(1) + 'B';
  if (abs >= 1e6) return (abs/1e6).toFixed(1) + 'M';
  if (abs >= 1e3) return (abs/1e3).toFixed(1) + 'K';
  return abs.toFixed(0);
}

function getHeatmapColor(val, sign, maxAbs, unit) {
  if (sign === 'zero' || val === 0 || !maxAbs) return {bg: 'rgba(30,41,59,0.3)', color: '#475569', glow: 'none'};
  let raw = Math.abs(val);
  if (unit === 'M') raw = raw * 1000000;
  else if (unit === 'K') raw = raw * 1000;
  else if (unit === 'B') raw = raw * 1000000000;
  
  let ratio = Math.min(raw / maxAbs, 1);
  ratio = Math.pow(ratio, 0.4);
  ratio = Math.max(ratio, 0.15);

  if (sign === 'positive') {
    const r = Math.round(16 + ratio * 40);
    const g = Math.round(45 + ratio * 190);
    const b = Math.round(25 + ratio * 90);
    
    const r2 = Math.min(Math.round(r + 30), 255);
    const g2 = Math.min(Math.round(g + 40), 255);
    const b2 = Math.min(Math.round(b + 30), 255);
    
    const tr = Math.round(120 + ratio * 135);
    const tg = Math.round(200 + ratio * 55);
    const tb = Math.round(120 + ratio * 135);
    
    const glow = ratio > 0.70 
      ? `0 0 12px rgba(34,197,94,${(ratio-0.70)*3.33})` 
      : 'none';
    
    return {
      bg: `linear-gradient(135deg, rgb(${r},${g},${b}), rgb(${r2},${g2},${b2}))`,
      color: `rgb(${tr},${tg},${tb})`,
      glow: glow
    };
  } else {
    const r = Math.round(45 + ratio * 190);
    const g = Math.round(16 + ratio * 60);
    const b = Math.round(45 + ratio * 200);
    
    const r2 = Math.min(Math.round(r + 35), 255);
    const g2 = Math.min(Math.round(g + 25), 255);
    const b2 = Math.min(Math.round(b + 20), 255);
    
    const tr = Math.round(180 + ratio * 75);
    const tg = Math.round(140 + ratio * 115);
    const tb = Math.round(220 + ratio * 35);
    
    const glow = ratio > 0.70 
      ? `0 0 12px rgba(168,85,247,${(ratio-0.70)*3.33})` 
      : 'none';
    
    return {
      bg: `linear-gradient(135deg, rgb(${r},${g},${b}), rgb(${r2},${g2},${b2}))`,
      color: `rgb(${tr},${tg},${tb})`,
      glow: glow
    };
  }
}

function formatCellValue(val, unit) {
  let raw = Math.abs(val);
  if (unit === 'M') raw = raw * 1000000;
  else if (unit === 'K') raw = raw * 1000;
  else if (unit === 'B') raw = raw * 1000000000;

  if (raw >= 1000000) return '$' + (raw/1000000).toFixed(1) + 'M';
  if (raw >= 1000) return '$' + (raw/1000).toFixed(1) + 'K';
  return '$' + raw.toFixed(1);
}

function renderGEX(data) {
  const spot = data.spot || 0;
  const isIndex = ['SPX', 'SPY', 'QQQ', 'IWM', 'DIA'].includes(data.ticker);
  const strikeRange = isIndex ? 0.04 : 0.20;
  const kingStrike = data.patterns?.KING?.strike;

  const filteredHeatmap = (data.heatmap || []).filter(row => {
    if (!row.strike) return false;
    const inRange = Math.abs(row.strike - spot) / spot <= strikeRange;
    const isKing = kingStrike && Math.abs(row.strike - kingStrike) < 0.01;
    return inRange || isKing;
  }).sort((a, b) => b.strike - a.strike);

  let maxAbs = 0;
  filteredHeatmap.forEach(row => {
    data.expiries.forEach(exp => {
      const v = Math.abs(row[exp] || 0);
      const unit = row[exp + '_unit'] || '';
      let raw = v;
      if (unit === 'M') raw = v * 1000000;
      else if (unit === 'K') raw = v * 1000;
      else if (unit === 'B') raw = v * 1000000000;
      if (raw > maxAbs) maxAbs = raw;
    });
  });
  if (maxAbs === 0) maxAbs = 1;

  document.getElementById('spotLabel').textContent = data.ticker + ' Spot';

  const changePct = data.change_percent;
  const changeVal = data.change;
  let changeHtml = '';

  if (changePct !== undefined && changePct !== null) {
    const isUp = changePct >= 0;
    const arrow = isUp ? '▲' : '▼';
    const cls = isUp ? 'up' : 'down';
    changeHtml = ` <span class="spot-change ${cls}">${arrow} ${Math.abs(changePct).toFixed(2)}%</span>`;
  } else if (changeVal !== undefined && changeVal !== null) {
    const isUp = changeVal >= 0;
    const arrow = isUp ? '▲' : '▼';
    const cls = isUp ? 'up' : 'down';
    const pct = spot > 0 ? (changeVal / (spot - changeVal) * 100) : 0;
    changeHtml = ` <span class="spot-change ${cls}">${arrow} ${Math.abs(pct).toFixed(2)}%</span>`;
  }

  document.getElementById('spotValue').innerHTML = spot.toLocaleString('en-US', {minimumFractionDigits: 2}) + changeHtml;
  document.getElementById('vixValue').textContent = data.vix || '—';
  document.getElementById('odteVol').textContent = data.odte_vol || '—';
  document.getElementById('netGex').textContent = data.patterns && data.patterns.SPOT ? formatGex(data.patterns.SPOT.gex) : '—';
  document.getElementById('spotPattern').textContent = data.trade_plan ? data.trade_plan.primary_pattern || '—' : '—';

  renderStructureMap(data);

  const annotations = {};
  const p = data.patterns || {};
  const tp = data.trade_plan || {};

  function addAnn(strike, type) {
    if (strike === undefined || strike === null) return;
    const key = parseFloat(strike);
    annotations[key] = annotations[key] || [];
    if (!annotations[key].includes(type)) annotations[key].push(type);
  }

  if (data.spot) {
    const spotStrike = Math.round(data.spot * 2) / 2;
    addAnn(spotStrike, 'spot');
  }

  if (p.KING?.strike) addAnn(p.KING.strike, 'king');
  if (p.CEILING?.strike) addAnn(p.CEILING.strike, 'ceiling');
  if (p.THE_RUG?.ceiling) addAnn(p.THE_RUG.ceiling, 'ceiling');
  if (p.FLOOR?.strike) addAnn(p.FLOOR.strike, 'floor');
  if (p.REVERSE_RUG?.floor) addAnn(p.REVERSE_RUG.floor, 'floor');
  if (tp.floor) addAnn(tp.floor, 'floor');
  if (p.VACUUM_ABOVE?.strike) addAnn(p.VACUUM_ABOVE.strike, 'vacuum');
  if (tp.vacuum_above) addAnn(tp.vacuum_above, 'vacuum');
  if (p.VACUUM_BELOW?.strike) addAnn(p.VACUUM_BELOW.strike, 'vacuum');
  if (tp.vacuum_below) addAnn(tp.vacuum_below, 'vacuum');

  if (tp.band_low && tp.band_high) {
    for (let s = parseFloat(tp.band_low); s <= parseFloat(tp.band_high); s += 2.5) {
      addAnn(s, 'band');
    }
  }
  if (p.POSITIVE_BAND?.low && p.POSITIVE_BAND?.high) {
    for (let s = parseFloat(p.POSITIVE_BAND.low); s <= parseFloat(p.POSITIVE_BAND.high); s += 2.5) {
      addAnn(s, 'band');
    }
  }

  const grid = document.getElementById('heatmapGrid');
  let html = `<div class="heatmap-header">Strike</div>`;
  data.expiries.forEach(e => {
    const short = e.slice(5);
    html += `<div class="heatmap-header">${short}</div>`;
  });

  filteredHeatmap.forEach(row => {
    const isSpot = row.is_spot;
    const isKing = data.patterns && data.patterns.KING && data.patterns.KING.strike === row.strike;
    const rowAnns = annotations[row.strike] || [];

    let badges = '';
    if (rowAnns.includes('king')) badges += '<span class="annotation-badge annotation-king">King</span>';
    if (rowAnns.includes('spot')) badges += '<span class="annotation-badge annotation-spot">Spot</span>';
    if (rowAnns.includes('ceiling')) badges += '<span class="annotation-badge annotation-ceiling">Ceiling</span>';
    if (rowAnns.includes('floor')) badges += '<span class="annotation-badge annotation-floor">Floor</span>';
    if (rowAnns.includes('vacuum')) badges += '<span class="annotation-badge annotation-vacuum">Vacuum</span>';
    if (rowAnns.includes('band')) badges += '<span class="annotation-badge annotation-band">Band</span>';

    const arrow = isSpot ? '<span class="spot-arrow">▶</span>' : '';
    const kingIcon = isKing ? '<span class="king-icon">👑</span>' : '';
    html += `<div class="heatmap-strike ${isSpot ? 'spot' : ''}">${arrow}${row.strike.toLocaleString()}${kingIcon}${badges}</div>`;

    data.expiries.forEach(exp => {
      const val = row[exp];
      const sign = row[exp + '_sign'];
      if (sign === 'zero' || val === 0 || val === undefined) {
        html += `<div class="heatmap-cell cell-empty">—</div>`;
      } else {
        const unit = row[exp + '_unit'] || '';
        const colors = getHeatmapColor(val, sign, maxAbs, unit);
        const display = formatCellValue(val, unit);
        let cellClasses = [];
        if (isSpot) cellClasses.push('cell-spot');
        if (isKing) cellClasses.push('cell-king');
        if (rowAnns.includes('king')) cellClasses.push('cell-annotation-king');
        if (rowAnns.includes('ceiling')) cellClasses.push('cell-annotation-ceiling');
        if (rowAnns.includes('floor')) cellClasses.push('cell-annotation-floor');
        if (rowAnns.includes('vacuum')) cellClasses.push('cell-annotation-vacuum');
        if (rowAnns.includes('band')) cellClasses.push('cell-annotation-band');

        const clsStr = cellClasses.join(' ');
        const tooltip = `<div class="tooltip">${val.toFixed(1)} ${sign === 'positive' ? '+' : '−'}GEX</div>`;
        const glowStyle = colors.glow && colors.glow !== 'none' ? `box-shadow:${colors.glow};` : '';
        html += `<div class="heatmap-cell ${clsStr}" style="background:${colors.bg}; color:${colors.color};${glowStyle}">${display}${tooltip}</div>`;
      }
    });
  });
  grid.innerHTML = html;

  const strip = document.getElementById('xpStrip');
  let stripHtml = '';
  data.expiries.forEach(exp => {
    let sum = 0;
    filteredHeatmap.forEach(r => { if (r[exp]) sum += r[exp]; });
    const short = exp.slice(5);
    const cls = sum >= 0 ? 'positive' : 'negative';
    const sign = sum >= 0 ? '+' : '';
    const absSum = Math.abs(sum);
    const display = absSum > 1000000 ? (absSum/1000000).toFixed(1) + 'B' : absSum > 1000 ? (absSum/1000).toFixed(1) + 'M' : absSum.toFixed(0) + 'K';
    stripHtml += `<div class="xp-item ${cls}"><div class="xp-label">${short}</div><div class="xp-value">${sign}${display}</div></div>`;
  });
  strip.innerHTML = stripHtml;

  const levels = document.getElementById('levelsGrid');
  const spotPat = p.SPOT || {};

  let levelsHtml = '';
  const regimeColor = spotPat.regime === 'VOLATILE' ? 'var(--accent-purple)' : spotPat.regime === 'PINNED' ? 'var(--accent-green)' : 'var(--accent-blue)';
  levelsHtml += `<div class="level-card"><div class="level-label">Spot Regime</div><div class="level-value" style="color:${regimeColor}">${spotPat.regime || 'NEUTRAL'}</div><div class="level-desc">${formatGex(spotPat.gex)} at ${spotPat.strike}</div></div>`;

  const ceiling = data.levels?.ceiling || p.CEILING?.strike || p.THE_RUG?.ceiling;
  if (ceiling) {
    levelsHtml += `<div class="level-card highlight"><div class="level-label" style="color:var(--accent-green)">Ceiling</div><div class="level-value" style="color:var(--accent-green)">${ceiling}</div><div class="level-desc">+GEX rejects price</div></div>`;
  } else {
    levelsHtml += `<div class="level-card"><div class="level-label">Ceiling</div><div class="level-value" style="color:var(--text-muted)">—</div><div class="level-desc">No cap detected</div></div>`;
  }

  const king = p.KING || {};
  const kingColor = king.is_negative ? 'var(--accent-purple)' : 'var(--accent-green)';
  const kingLabel = king.is_negative ? 'VACUUM' : 'MAGNET';
  levelsHtml += `<div class="level-card"><div class="level-label" style="color:${kingColor}">King (${kingLabel})</div><div class="level-value" style="color:${kingColor}">${king.strike || '—'}</div><div class="level-desc">${king.type || ''}</div></div>`;

  const floor = data.levels?.floor || p.FLOOR?.strike || p.REVERSE_RUG?.floor || tp.floor;
  if (floor) {
    levelsHtml += `<div class="level-card"><div class="level-label" style="color:var(--accent-green)">Floor</div><div class="level-value" style="color:var(--accent-green)">${floor}</div><div class="level-desc">+GEX supports price</div></div>`;
  } else {
    levelsHtml += `<div class="level-card"><div class="level-label">Floor</div><div class="level-value" style="color:var(--text-muted)">—</div><div class="level-desc">No floor detected</div></div>`;
  }

  const vacAbove = p.VACUUM_ABOVE?.strike || tp.vacuum_above;
  if (vacAbove) {
    levelsHtml += `<div class="level-card"><div class="level-label" style="color:var(--accent-purple)">Vacuum ↑</div><div class="level-value" style="color:var(--accent-purple)">${vacAbove}</div><div class="level-desc">Pulls price UP</div></div>`;
  }

  const vacBelow = p.VACUUM_BELOW?.strike || tp.vacuum_below;
  if (vacBelow) {
    levelsHtml += `<div class="level-card"><div class="level-label" style="color:var(--accent-purple)">Vacuum ↓</div><div class="level-value" style="color:var(--accent-purple)">${vacBelow}</div><div class="level-desc">Pulls price DOWN</div></div>`;
  }

  const bandLow = tp.band_low || p.POSITIVE_BAND?.low;
  const bandHigh = tp.band_high || p.POSITIVE_BAND?.high;
  if (bandLow && bandHigh) {
    levelsHtml += `<div class="level-card highlight"><div class="level-label" style="color:var(--accent-green)">Pin Band</div><div class="level-value" style="color:var(--accent-green)">${bandLow}–${bandHigh}</div><div class="level-desc">Spot inside positive band</div></div>`;
  }

  levels.innerHTML = levelsHtml;

  renderBattlefield(data);
}

function formatGex(val) {
  if (!val) return '—';
  const abs = Math.abs(val);
  const sign = val < 0 ? '-' : '+';
  if (abs >= 1e9) return sign + '$' + (abs/1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return sign + '$' + (abs/1e6).toFixed(1) + 'M';
  return sign + '$' + (abs/1e3).toFixed(1) + 'K';
}

function startAutoRefresh() {
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(() => {
    if (currentTicker) loadTicker(currentTicker);
  }, 60000);
}

document.addEventListener('DOMContentLoaded', () => {
  loadTicker('SPX');
  startAutoRefresh();
});
</script>
