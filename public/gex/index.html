<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merk-I | GEX Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e17; --bg-secondary: #0f172a; --bg-tertiary: #1e293b;
  --border: #334155; --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #64748b;
  --accent-gold: #fbbf24; --accent-green: #22c55e; --accent-red: #ef4444;
  --accent-purple: #a855f7; --accent-blue: #38bdf8; --accent-orange: #f97316;
  --font-main: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-main); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

/* NAVBAR */
.navbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 28px; border-bottom: 1px solid var(--border);
  background: rgba(10,14,23,0.95); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent-gold), #f59e0b);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: var(--bg-primary); font-size: 18px;
}
.brand-text h1 {
  font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
  background: linear-gradient(90deg, var(--accent-gold), #f59e0b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-text p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.nav-right { display: flex; align-items: center; gap: 12px; }
.status-pill {
  display: flex; align-items: center; gap: 6px; background: var(--bg-secondary);
  border: 1px solid var(--border); padding: 6px 14px; border-radius: 8px;
  font-size: 12px; color: var(--text-secondary);
}
.status-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s infinite; }
.status-dot.error { background: var(--accent-red); animation: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* MAIN */
.main-container { max-width: 1440px; margin: 0 auto; padding: 24px 28px; }
.section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
.section-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.section-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.ticker-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.ticker-btn {
  padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 700;
  border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-secondary);
  cursor: pointer; transition: all 0.15s; font-family: var(--font-main);
}
.ticker-btn:hover { border-color: var(--accent-gold); color: var(--text-primary); }
.ticker-btn.active { background: var(--accent-gold); color: var(--bg-primary); border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(251,191,36,0.15); }
.ticker-input-wrap { display: flex; gap: 6px; align-items: center; margin-left: 8px; }
.ticker-input {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; color: var(--text-primary); font-size: 13px; font-family: var(--font-main);
  width: 120px; text-transform: uppercase;
}
.ticker-input:focus { outline: none; border-color: var(--accent-gold); }
.btn-go {
  background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.btn-go:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
.btn-refresh {
  background: transparent; color: var(--text-muted); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  margin-left: auto;
}
.btn-refresh:hover { color: var(--accent-gold); border-color: var(--accent-gold); }

.card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.card-title { font-size: 13px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

/* SPOT BAR */
.spot-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 24px; margin-bottom: 16px; flex-wrap: wrap; gap: 16px;
}
.spot-main h2 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
.spot-change { font-size: 14px; font-weight: 600; margin-left: 8px; }
.spot-change.up { color: var(--accent-green); }
.spot-change.down { color: var(--accent-red); }
.spot-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.spot-metrics { display: flex; gap: 24px; flex-wrap: wrap; }
.spot-metric { text-align: right; }
.spot-metric-value { font-size: 18px; font-weight: 700; }
.spot-metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

/* HEATMAP */
.heatmap-container { overflow-x: auto; max-height: 70vh; overflow-y: auto; }
.heatmap-grid { display: grid; grid-template-columns: 90px repeat(5, 1fr); gap: 2px; font-size: 11px; min-width: 600px; }
.heatmap-header { color: var(--text-muted); font-weight: 700; padding: 10px 6px; text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; background: var(--bg-secondary); z-index: 5; }
.heatmap-strike { color: var(--text-muted); padding: 10px 8px; text-align: right; font-weight: 600; font-family: var(--font-mono); font-size: 11px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.heatmap-strike.spot { color: var(--accent-gold); font-weight: 800; background: rgba(251,191,36,0.05); }
.heatmap-strike .spot-arrow { color: var(--accent-blue); font-size: 10px; }
.heatmap-cell {
  padding: 10px 4px; text-align: center; border-radius: 4px; font-weight: 700;
  font-family: var(--font-mono); font-size: 10px; position: relative; transition: transform 0.15s;
  min-height: 36px; display: flex; align-items: center; justify-content: center;
}
.heatmap-cell:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 0 12px rgba(0,0,0,0.5); }
.cell-empty { background: transparent; color: #334155; }
.cell-spot { box-shadow: inset 0 0 0 2px var(--accent-blue); }

.xp-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.xp-item { border-radius: 6px; padding: 8px; text-align: center; }
.xp-item.positive { background: #14532d; }
.xp-item.negative { background: #581c87; border: 1px solid var(--accent-purple); }
.xp-label { font-size: 9px; color: #86efac; text-transform: uppercase; font-weight: 700; }
.xp-item.negative .xp-label { color: #d8b4fe; }
.xp-value { font-size: 12px; font-weight: 800; color: #fff; }

/* LEVELS */
.levels-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.level-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; transition: all 0.2s; }
.level-card:hover { border-color: var(--accent-gold); transform: translateY(-2px); }
.level-card.highlight { border-color: var(--accent-gold); background: rgba(251,191,36,0.05); }
.level-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.level-value { font-size: 22px; font-weight: 800; margin-top: 4px; }
.level-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* PATTERNS */
.pattern-list { display: flex; flex-direction: column; gap: 8px; }
.pattern-tag { background: var(--bg-tertiary); border-left: 3px solid var(--accent-gold); padding: 10px 12px; border-radius: 0 8px 8px 0; cursor: pointer; transition: all 0.2s; }
.pattern-tag:hover { background: #283548; }
.pattern-tag.bearish { border-left-color: var(--accent-red); }
.pattern-tag.bullish { border-left-color: var(--accent-green); }
.pattern-tag.neutral { border-left-color: var(--accent-blue); }
.pattern-tag.warning { border-left-color: var(--accent-orange); }
.pattern-tag-header { display: flex; justify-content: space-between; align-items: center; }
.pattern-tag-name { font-weight: 700; font-size: 12px; }
.pattern-tag-meta { font-size: 10px; color: var(--text-muted); font-weight: 600; }
.pattern-tag-desc { font-size: 11px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }

/* TRADE PLAN */
.trade-plan { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.trade-plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.trade-bias { padding: 4px 14px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
.trade-bias.bullish { background: rgba(34,197,94,0.15); color: var(--accent-green); }
.trade-bias.bearish { background: rgba(239,68,68,0.15); color: var(--accent-red); }
.trade-bias.neutral { background: rgba(56,189,248,0.15); color: var(--accent-blue); }
.trade-bias.notrade { background: rgba(148,163,184,0.15); color: var(--text-secondary); }
.trade-confidence { font-size: 13px; font-weight: 700; color: var(--accent-gold); }
.trade-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.trade-row:last-child { border-bottom: none; }
.trade-label { color: var(--text-muted); font-weight: 600; }
.trade-value { color: var(--text-primary); font-weight: 700; text-align: right; }
.trade-note { margin-top: 12px; padding: 12px; background: var(--bg-primary); border-radius: 8px; border: 1px solid var(--border); font-size: 11px; color: var(--text-secondary); line-height: 1.6; font-style: italic; }

.two-col { display: grid; grid-template-columns: 1fr 380px; gap: 20px; }

/* LOADING */
.loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
.loading::after { content: ""; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; margin-left: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

.error { padding: 20px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; color: var(--accent-red); font-size: 13px; }

.last-update { font-size: 11px; color: var(--text-muted); margin-left: 12px; }

@media (max-width: 1100px) {
  .two-col { grid-template-columns: 1fr; }
  .levels-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .navbar { flex-direction: column; gap: 12px; padding: 12px 16px; }
  .main-container { padding: 16px; }
  .spot-bar { flex-direction: column; gap: 12px; align-items: flex-start; }
  .spot-metrics { width: 100%; justify-content: space-between; }
  .levels-grid { grid-template-columns: 1fr 1fr; }
  .ticker-bar { gap: 6px; }
  .ticker-input { width: 100px; }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
<base target="_blank">

<body>

<nav class="navbar">
  <div class="brand">
    <div class="brand-logo">Γ</div>
    <div class="brand-text">
      <h1>merk-I</h1>
      <p>GEX Intelligence · Live Options Data</p>
    </div>
  </div>
  <div class="nav-right">
    <span class="last-update" id="lastUpdate">—</span>
    <div class="status-pill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </div>
</nav>

<div class="main-container">

<!-- ===== GEX SECTION ===== -->
<div id="section-gex">
  <div class="section-header">
    <div>
      <h2 class="section-title">Gamma Exposure Map</h2>
      <p class="section-subtitle">Dealer positioning by strike × expiry · Live Tradier data</p>
    </div>
  </div>

  <div class="ticker-bar" id="gexTickerBar">
    <button class="ticker-btn active" data-ticker="SPX" onclick="loadTicker('SPX')">SPX</button>

      <input type="text" class="ticker-input" id="customTicker" placeholder="TICKER" maxlength="6" onkeypress="if(event.key==='Enter') loadCustomTicker()">
      <button class="btn-go" onclick="loadCustomTicker()">Go</button>
    </div>
    <button class="btn-refresh" onclick="manualRefresh()">↻ Refresh</button>
  </div>

  <div id="gexLoading" class="loading" style="display:none;">Loading GEX data</div>
  <div id="gexError" class="error" style="display:none;"></div>

  <div id="gexContent">
    <div class="spot-bar" id="spotBar">
      <div class="spot-main">
        <div class="spot-label" id="spotLabel">SPX Spot</div>
        <h2 id="spotValue">—</h2>
      </div>
      <div class="spot-metrics" id="spotMetrics">
        <div class="spot-metric"><div class="spot-metric-label">VIX</div><div class="spot-metric-value" id="vixValue">—</div></div>
        <div class="spot-metric"><div class="spot-metric-label">0DTE Vol</div><div class="spot-metric-value" id="odteVol">—</div></div>
        <div class="spot-metric"><div class="spot-metric-label">Net GEX</div><div class="spot-metric-value" id="netGex">—</div></div>
        <div class="spot-metric"><div class="spot-metric-label">Pattern</div><div class="spot-metric-value" id="spotPattern" style="color:var(--accent-gold);">—</div></div>
      </div>
    </div>

    <div class="two-col">
      <div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">GEX Heatmap — 5 Expiries</span>
            <div style="display:flex; gap:12px; font-size:11px; align-items:center;">
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px;height:10px;background:#22c55e;border-radius:2px;"></span> +GEX</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px;height:10px;background:#a855f7;border-radius:2px;"></span> -GEX</span>

      <div>
        <div class="card">
          <div class="card-header"><span class="card-title">AI Pattern Detection</span></div>
          <div class="pattern-list" id="patternList"></div>
        </div>

        <div class="trade-plan">
          <div class="trade-plan-header">
            <span class="trade-bias" id="tradeBias">NEUTRAL</span>
            <span class="trade-confidence" id="tradeConfidence">Confidence: —%</span>
          </div>
          <div id="tradePlanBody"></div>
          <div class="trade-note" id="tradeNote"></div>
        </div>
      </div>
    </div>
  </div>
</div>

</div>

<script>
// ===== STATE =====
let currentData = null;
let currentTicker = 'SPX';
let refreshInterval = null;
const STRIKE_RANGE = 0.04; // ±4% around spot

// ===== DATA FETCHING =====
async function loadTicker(ticker) {
  currentTicker = ticker;
  document.querySelectorAll('.ticker-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.ticker-btn[data-ticker="${ticker}"]`);
  if (btn) btn.classList.add('active');

  document.getElementById('gexLoading').style.display = 'flex';
  document.getElementById('gexContent').style.display = 'none';
  document.getElementById('gexError').style.display = 'none';

  try {
    const response = await fetch(`/api/gex/${ticker}`);
    if (!response.ok) throw new Error('API error: ' + response.status);
    const data = await response.json();
    currentData = data;
    renderGEX(data);
    setStatus(true, 'Live API Connected');
    document.getElementById('gexLoading').style.display = 'none';
    document.getElementById('gexContent').style.display = 'block';
  } catch (err) {
    console.log('Live API failed:', err);
    document.getElementById('gexError').textContent = 'Live API unavailable. Showing fallback data. Error: ' + err.message;
    document.getElementById('gexError').style.display = 'block';
    const fallback = getFallbackData(ticker);
    currentData = fallback;
    renderGEX(fallback);
    setStatus(false, 'API Error — Fallback Data');
    document.getElementById('gexLoading').style.display = 'none';
    document.getElementById('gexContent').style.display = 'block';
  }
  updateTimestamp();
}

function loadCustomTicker() {
  const input = document.getElementById('customTicker');
  const ticker = input.value.trim().toUpperCase();
  if (!ticker) return;
  
  // Add button if not exists
  const bar = document.getElementById('gexTickerBar');
  const existing = bar.querySelector(`[data-ticker="${ticker}"]`);
  if (!existing) {
    const btn = document.createElement('button');
    btn.className = 'ticker-btn';
    btn.setAttribute('data-ticker', ticker);
    btn.textContent = ticker;
    btn.onclick = () => loadTicker(ticker);
    // Insert before the input wrap
    const wrap = bar.querySelector('.ticker-input-wrap');
    bar.insertBefore(btn, wrap);
  }
  loadTicker(ticker);
  input.value = '';
}

function manualRefresh() {
  if (currentTicker) loadTicker(currentTicker);
}

function setStatus(online, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (online) {
    dot.className = 'status-dot';
    txt.textContent = text;
  } else {
    dot.className = 'status-dot error';
    txt.textContent = text;
  }
}

function updateTimestamp() {
  const now = new Date();
  document.getElementById('lastUpdate').textContent = 'Updated: ' + now.toLocaleTimeString();
}

// ===== FALLBACK DATA =====
function getFallbackData(ticker) {

    ticker: 'SPX', spot: 5520.45, vix: 14.82, odte_vol: '2.1M',

    heatmap: [

      {strike:5575, is_spot:false, '2026-08-04':-45.2, '2026-08-04_sign':'negative', '2026-08-05':-38.1, '2026-08-05_sign':'negative', '2026-08-06':0, '2026-08-06_sign':'zero', '2026-08-08':0, '2026-08-08_sign':'zero', '2026-08-11':0, '2026-08-11_sign':'zero'},
      {strike:5550, is_spot:false, '2026-08-04':210.5, '2026-08-04_sign':'positive', '2026-08-05':180.3, '2026-08-05_sign':'positive', '2026-08-06':0, '2026-08-06_sign':'zero', '2026-08-08':0, '2026-08-08_sign':'zero', '2026-08-11':0, '2026-08-11_sign':'zero'},
      {strike:5525, is_spot:false, '2026-08-04':580.2, '2026-08-04_sign':'positive', '2026-08-05':340.8, '2026-08-05_sign':'positive', '2026-08-06':120.4, '2026-08-06_sign':'positive', '2026-08-08':0, '2026-08-08_sign':'zero', '2026-08-11':0, '2026-08-11_sign':'zero'},
      {strike:5510, is_spot:false, '2026-08-04':95.3, '2026-08-04_sign':'positive', '2026-08-05':0, '2026-08-05_sign':'zero', '2026-08-06':0, '2026-08-06_sign':'zero', '2026-08-08':0, '2026-08-08_sign':'zero', '2026-08-11':0, '2026-08-11_sign':'zero'},
      {strike:5500, is_spot:true, '2026-08-04':-120.5, '2026-08-04_sign':'negative', '2026-08-05':0, '2026-08-05_sign':'zero', '2026-08-06':0, '2026-08-06_sign':'zero', '2026-08-08':0, '2026-08-08_sign':'zero', '2026-08-11':0, '2026-08-11_sign':'zero'},
      {strike:5480, is_spot:false, '2026-08-04':0, '2026-08-04_sign':'zero', '2026-08-05':-85.2, '2026-08-05_sign':'negative', '2026-08-06':0, '2026-08-06_sign':'zero', '2026-08-08':0, '2026-08-08_sign':'zero', '2026-08-11':0, '2026-08-11_sign':'zero'},

// ===== HEATMAP COLOR ENGINE =====
function getHeatmapColor(val, sign, maxAbs) {
  if (sign === 'zero' || val === 0 || !maxAbs) return {bg: 'transparent', color: '#334155'};
  const abs = Math.abs(val);
  const ratio = Math.min(abs / maxAbs, 1);
  
  if (sign === 'positive') {
    // Green gradient: dark forest → bright emerald
    const h = 142;
    const s = 60 + ratio * 30;
    const l = 18 + ratio * 22;
    const textL = 70 + ratio * 25;
    return {bg: `hsl(${h},${s}%,${l}%)`, color: `hsl(${h},80%,${textL}%)`};
  } else {
    // Purple/magenta gradient for negative (like reference image)
    const h = 270 + ratio * 20; // 270→290
    const s = 55 + ratio * 35;
    const l = 22 + ratio * 18;
    const textL = 75 + ratio * 20;
    return {bg: `hsl(${h},${s}%,${l}%)`, color: `hsl(280,90%,${textL}%)`};
  }
}

function formatCellValue(val) {
  const abs = Math.abs(val);
  if (abs >= 1000000) return '$' + (abs/1000000).toFixed(1) + 'M';
  if (abs >= 1000) return '$' + (abs/1000).toFixed(1) + 'K';
  return '$' + abs.toFixed(1) + 'K';
}

// ===== RENDER GEX =====
function renderGEX(data) {
  const spot = data.spot || 0;
  
  // Filter strikes to ±4% around spot
  const filteredHeatmap = (data.heatmap || []).filter(row => {
    if (!row.strike) return false;
    return Math.abs(row.strike - spot) / spot <= STRIKE_RANGE;
  }).sort((a, b) => b.strike - a.strike); // highest strike at top

  // Compute max absolute GEX for color scaling
  let maxAbs = 0;
  filteredHeatmap.forEach(row => {
    data.expiries.forEach(exp => {
      const v = Math.abs(row[exp] || 0);
      if (v > maxAbs) maxAbs = v;
    });
  });
  if (maxAbs === 0) maxAbs = 1;

  // Spot bar
  document.getElementById('spotLabel').textContent = data.ticker + ' Spot';
  document.getElementById('spotValue').innerHTML = spot.toLocaleString('en-US', {minimumFractionDigits: 2}) + ' <span class="spot-change up">▲ 0.22%</span>';
  document.getElementById('vixValue').textContent = data.vix || '—';
  document.getElementById('odteVol').textContent = data.odte_vol || '—';
  document.getElementById('netGex').textContent = data.patterns && data.patterns.SPOT ? formatGex(data.patterns.SPOT.gex) : '—';
  document.getElementById('spotPattern').textContent = data.trade_plan ? data.trade_plan.primary_pattern || '—' : '—';

  // Heatmap
  const grid = document.getElementById('heatmapGrid');
  let html = `<div class="heatmap-header">Strike</div>`;
  data.expiries.forEach(e => {
    const short = e.slice(5);
    html += `<div class="heatmap-header">${short}</div>`;
  });

  filteredHeatmap.forEach(row => {
    const isSpot = row.is_spot;
    const isKing = data.patterns && data.patterns.KING && data.patterns.KING.strike === row.strike;
    const arrow = isSpot ? '<span class="spot-arrow">▶</span>' : '';
    const kingLabel = isKing ? ' ★' : '';
    html += `<div class="heatmap-strike ${isSpot ? 'spot' : ''}">${arrow}${row.strike.toLocaleString()}${kingLabel}</div>`;
    
    data.expiries.forEach(exp => {
      const val = row[exp];
      const sign = row[exp + '_sign'];
      if (sign === 'zero' || val === 0 || val === undefined) {
        html += `<div class="heatmap-cell cell-empty">—</div>`;
      } else {
        const colors = getHeatmapColor(val, sign, maxAbs);
        const display = formatCellValue(val);
        const spotCls = isSpot ? 'cell-spot' : '';
        const kingStar = isKing ? ' ★' : '';
        html += `<div class="heatmap-cell ${spotCls}" style="background:${colors.bg}; color:${colors.color};">${display}${kingStar}</div>`;
      }
    });
  });
  grid.innerHTML = html;

  // Cross-expiry strip
  const strip = document.getElementById('xpStrip');
  let stripHtml = '';
  data.expiries.forEach(exp => {
    let sum = 0;
    filteredHeatmap.forEach(r => { if (r[exp]) sum += r[exp]; });
    const short = exp.slice(5);
    const cls = sum >= 0 ? 'positive' : 'negative';
    const sign = sum >= 0 ? '+' : '';
    const absSum = Math.abs(sum);
    const display = absSum > 1000 ? (absSum/1000).toFixed(1) + 'B' : absSum > 1 ? absSum.toFixed(0) + 'M' : (absSum*1000).toFixed(0) + 'K';
    stripHtml += `<div class="xp-item ${cls}"><div class="xp-label">${short}</div><div class="xp-value">${sign}${display}</div></div>`;
  });
  strip.innerHTML = stripHtml;

  // Levels
  const levels = document.getElementById('levelsGrid');
  const p = data.patterns || {};
  const tp = data.trade_plan || {};
  const king = p.KING || {};
  const spotPat = p.SPOT || {};

  let levelsHtml = '';
  const regimeColor = spotPat.regime === 'VOLATILE' ? 'var(--accent-purple)' : spotPat.regime === 'PINNED' ? 'var(--accent-green)' : 'var(--accent-blue)';
  levelsHtml += `<div class="level-card"><div class="level-label">Spot Regime</div><div class="level-value" style="color:${regimeColor}">${spotPat.regime || 'NEUTRAL'}</div><div class="level-desc">${formatGex(spotPat.gex)} at ${spotPat.strike}</div></div>`;

  if (data.levels && data.levels.ceiling) {
    levelsHtml += `<div class="level-card highlight"><div class="level-label" style="color:var(--accent-gold)">Ceiling</div><div class="level-value" style="color:var(--accent-gold)">${data.levels.ceiling}</div><div class="level-desc">Front-week cap</div></div>`;
  } else {
    levelsHtml += `<div class="level-card"><div class="level-label">Ceiling</div><div class="level-value" style="color:var(--text-muted)">—</div><div class="level-desc">No cap detected</div></div>`;
  }

  const kingColor = king.is_negative ? 'var(--accent-purple)' : 'var(--accent-green)';
  levelsHtml += `<div class="level-card"><div class="level-label" style="color:${kingColor}">King</div><div class="level-value" style="color:${kingColor}">${king.strike || '—'}</div><div class="level-desc">${king.type || ''}</div></div>`;

  if (data.levels && data.levels.floor) {
    levelsHtml += `<div class="level-card"><div class="level-label" style="color:var(--accent-blue)">Floor</div><div class="level-value" style="color:var(--accent-blue)">${data.levels.floor}</div><div class="level-desc">Support shelf</div></div>`;
  } else {
    levelsHtml += `<div class="level-card"><div class="level-label">Floor</div><div class="level-value" style="color:var(--text-muted)">—</div><div class="level-desc">No floor detected</div></div>`;
  }
  levels.innerHTML = levelsHtml;

  // Patterns
  const patList = document.getElementById('patternList');
  let patHtml = '';
  const patternMap = {
    'THE_RUG': {cls: 'bearish', color: 'var(--accent-red)', label: 'THE RUG'},
    'REVERSE_RUG': {cls: 'bullish', color: 'var(--accent-green)', label: 'REVERSE RUG'},
    'PIKA_CLOUD': {cls: 'neutral', color: 'var(--accent-blue)', label: 'PIKA CLOUD'},
    'AIR_POCKET': {cls: 'warning', color: 'var(--accent-orange)', label: 'AIR POCKET'},
    'WHIPSAW': {cls: 'warning', color: 'var(--accent-orange)', label: 'WHIPSAW'},
    'KING': {cls: 'warning', color: 'var(--accent-purple)', label: 'KING'},
    'SHELF_ABOVE': {cls: 'neutral', color: 'var(--accent-blue)', label: 'SHELF ABOVE'},
    'SHELF_BELOW': {cls: 'neutral', color: 'var(--accent-blue)', label: 'SHELF BELOW'},
    'CROSS_EXPIRY': {cls: 'neutral', color: 'var(--text-secondary)', label: 'CROSS-EXPIRY'},
    'GATEKEEPERS': {cls: 'neutral', color: 'var(--accent-gold)', label: 'GATEKEEPERS'}
  };

  Object.keys(p).forEach(key => {
    if (key === 'ticker' || key === 'spot' || key === 'spot_strike' || key === 'timestamp' || key === 'total_gex') return;
    const pat = p[key];
    if (!pat || typeof pat !== 'object') return;
    const meta = patternMap[key] || {cls: 'neutral', color: 'var(--text-secondary)', label: key.replace(/_/g, ' ')};
    const bias = pat.bias || (pat.is_negative ? 'NEGATIVE' : pat.detected ? 'DETECTED' : '');
    const conf = pat.confidence ? (pat.confidence * 100).toFixed(0) + '%' : '';
    const note = pat.note || pat.trade_note || '';
    patHtml += `<div class="pattern-tag ${meta.cls}"><div class="pattern-tag-header"><span class="pattern-tag-name" style="color:${meta.color}">${meta.label}</span><span class="pattern-tag-meta">${bias} ${conf}</span></div><div class="pattern-tag-desc">${note}</div></div>`;
  });
  patList.innerHTML = patHtml || '<div style="color:var(--text-muted); font-size:12px; padding:10px;">No patterns detected</div>';

  // Trade plan
  const biasEl = document.getElementById('tradeBias');
  biasEl.className = 'trade-bias ' + (tp.bias === 'BULLISH' ? 'bullish' : tp.bias === 'BEARISH' ? 'bearish' : tp.bias === 'NO_TRADE' ? 'notrade' : 'neutral');
  biasEl.textContent = tp.bias || 'NEUTRAL';
  document.getElementById('tradeConfidence').textContent = 'Confidence: ' + ((tp.confidence || 0) * 100).toFixed(0) + '%';

  const planBody = document.getElementById('tradePlanBody');
  const rows = [
    tp.setup ? ['Setup', tp.setup] : null,
    tp.entry ? ['Entry', tp.entry] : null,
    tp.stop_loss ? ['Stop Loss', tp.stop_loss] : null,
    tp.target_1 ? ['Target 1', tp.target_1] : null,
    tp.target_2 ? ['Target 2', tp.target_2] : null,
    tp.expiry ? ['Expiry', tp.expiry] : null,
    tp.instrument ? ['Instrument', tp.instrument] : null,
    tp.risk_note ? ['Risk', '2% account / spread'] : null
  ].filter(Boolean);

  planBody.innerHTML = rows.map(r => `<div class="trade-row"><span class="trade-label">${r[0]}</span><span class="trade-value">${r[1]}</span></div>`).join('');
  document.getElementById('tradeNote').textContent = tp.risk_note || 'No trade recommendation available.';
}

function formatGex(val) {
  if (!val) return '—';
  const abs = Math.abs(val);
  const sign = val < 0 ? '-' : '+';
  if (abs >= 1e9) return sign + '$' + (abs/1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return sign + '$' + (abs/1e6).toFixed(1) + 'M';
  return sign + '$' + (abs/1e3).toFixed(1) + 'K';
}

// ===== AUTO REFRESH =====
function startAutoRefresh() {
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(() => {
    if (currentTicker) loadTicker(currentTicker);
  }, 60000); // refresh every 60 seconds
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  loadTicker('SPX');
  startAutoRefresh();
});
